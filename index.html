<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servicio en mantenimiento</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f0e8;
      --card: #fffdf8;
      --ink: #1a1714;
      --muted: #6b6560;
      --accent: #8b1a1a;
      --border: #d6cfc4;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, var(--border) 39px, var(--border) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, var(--border) 40px, var(--border) 41px);
      background-size: 40px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lato', sans-serif;
      padding: 2rem;
    }

    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 4px;
      padding: 4rem 3.5rem;
      max-width: 640px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 6px 6px 0 var(--border);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: -10px; bottom: -10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      z-index: -1;
    }

    .stamp {
      display: inline-block;
      border: 2.5px solid var(--accent);
      color: var(--accent);
      font-family: 'Lato', sans-serif;
      font-weight: 400;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 2px;
      opacity: 0.85;
      margin-bottom: 2.5rem;
      transform: rotate(-1.5deg);
      display: inline-block;
    }

    .face {
      font-size: 5.5rem;
      line-height: 1;
      margin-bottom: 2rem;
      display: block;
      animation: sigh 3.5s ease-in-out infinite;
      filter: saturate(0.85);
    }

    @keyframes sigh {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50%       { transform: translateY(6px) rotate(2deg); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 700;
      color: var(--ink);
      line-height: 1.25;
      margin-bottom: 1.5rem;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .divider {
      width: 60px;
      height: 1.5px;
      background: var(--border);
      margin: 0 auto 1.5rem;
    }

    p {
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.8;
      letter-spacing: 0.01em;
    }

    .footer-line {
      margin-top: 3rem;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--border);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="stamp">Aviso oficial</div>
    <span class="face">😔</span>
    <h1>Servicio en mantenimiento<br>por <em>infravaloración de los socios</em><br>sobre los servicios prestados</h1>
    <div class="divider"></div>
    <p>Estamos trabajando para restablecer el servicio.<br>
    Disculpe las molestias ocasionadas.</p>
    <p class="footer-line">— La dirección —</p>
  </div>
</body>
</html>
